services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: packaging
      POSTGRES_PASSWORD: packaging
      POSTGRES_DB: packaging
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  nomad:
    image: hashicorp/nomad:latest
    command: agent -dev -bind=0.0.0.0 -client
    privileged: true
    ports:
      - "4646:4646"
      - "4647:4647"
      - "4648:4648"

volumes:
  postgres-data:
  minio-data:
