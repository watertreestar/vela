services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: packaging
      POSTGRES_PASSWORD: packaging
      POSTGRES_DB: packaging
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "${RUSTFS_HOST_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data

  nomad:
    image: ${NOMAD_IMAGE:-hashicorp/nomad:latest}
    command: agent -dev -bind=0.0.0.0 -client
    privileged: true
    profiles: ["nomad-container"]
    ports:
      - "4646:4646"
      - "4647:4647"
      - "4648:4648"

volumes:
  postgres-data:
  rustfs-data:
